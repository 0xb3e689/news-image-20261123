<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1024px;height:1024px;overflow:hidden;background:#EAE4D7;font-family:Georgia,serif;color:#111}
.masthead{height:92px;background:#12151C;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.masthead h1{font:900 48px 'Helvetica Neue',Arial,sans-serif;color:#FFF;letter-spacing:2px}
.masthead .date{background:#C81E1E;padding:10px 18px;border-radius:4px;font:800 24px 'Helvetica Neue',Arial,sans-serif;color:#FFF}
.grid{height:932px;padding:14px;display:flex;flex-direction:column;gap:12px}
.row1{display:flex;gap:12px;flex:0 0 462px}
.row2{display:flex;gap:12px;flex:0 0 430px}
.card{display:flex;flex-direction:column;overflow:hidden;background:#FAF7F0;border:2px solid #1C1917;border-radius:4px}
.card.hero{flex:0 0 584px}
.card.r1r{flex:0 0 400px}
.card.r2{flex:1}
.art-box{flex:1 1 0;min-height:0;width:100%;overflow:hidden;position:relative}
.art-box svg{width:100%;height:100%;display:block}
.caption-box{flex:0 0 auto;padding:12px 16px 14px;background:#FAF7F0;border-top:2px solid #1C1917}
.kicker{font:800 13px 'Helvetica Neue',Arial,sans-serif;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.headline{font-weight:800;line-height:1.15;color:#111}
.hero .headline{font-size:28px}.r1r .headline{font-size:24px}.r2 .headline{font-size:21px}
</style></head><body>
<div class="masthead"><h1>WORLD NEWS</h1><div class="date">MONDAY, 23 NOVEMBER 2026</div></div>
<div class="grid">
<div class="row1">
<div class="card hero">[CARD1_HTML]</div>
<div class="card r1r">[CARD2_HTML]</div>
</div>
<div class="row2">
<div class="card r2">[CARD3_HTML]</div>
<div class="card r2">[CARD4_HTML]</div>
<div class="card r2">[CARD5_HTML]</div>
</div>
</div></body></html>
